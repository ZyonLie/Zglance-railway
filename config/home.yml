
- name: Home
  # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
  # hide-desktop-navigation: true

  columns:
    - size: small
      widgets:
        - type: custom-api
          hide-header: true
          title: Next Race
          cache: 1d
          url: https://f1api.dev/api/current/next
          template:
            <div class="flex flex-column gap-5">
              {{ $session := index (.JSON.Array "race") 0 }}
              <p class="size-h5">
                Round {{ .JSON.String "round" }}
              </p>

              <div class="margin-block-4">
                <p class="color-highlight">{{ $session.String "raceName" }}</p>
                <p class="color-primary">
                  <span>Race</span>
                </p>
                <p class="size-h5">{{ $session.String "schedule.race.date" }}</p>
                </div>

              </ul>
            </div>

        - type: custom-api
          title: Last Race Results
          hide-header: true
          cache: 1d
          url: https://f1api.dev/api/current/last/race
          template: |
            <div class="flex flex-column gap-5">
              <p class="size-h5">{{ .JSON.String "races.raceName" }}</p>
              <ul class="list collapsible-container" data-collapse-after="5">
                {{ range $i, $v := .JSON.Array "races.results" }}
                <li class="flex items-center {{ if eq $i 0 }}color-primary{{ else if eq $i 1 }}color-highlight{{ end }}">
                  <span class="grow min-width-0">{{ .String "position" }}. {{ .String "driver.shortName" }}</span>
                  <span class="shrink-0 text-right">{{ .String "time" }}</span>
                </li>
                {{ end }}
              </ul>
            </div>
       
        - type: custom-api
          title: Steam Specials
          cache: 3h
          url: https://store.steampowered.com/api/featuredcategories?cc=id
          template: |
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
            {{ range .JSON.Array "specials.items" }}
            <li>
              <a class="size-h4 color-highlight block text-truncate" href="https://store.steampowered.com/app/{{ .Int "id" }}/">{{ .String "name" }}</a>
              <ul class="list-horizontal-text">
                <li>{{ div (.Int "final_price" | toFloat) 100 | printf "Rp%.2f" }}</li>
                {{ $discount := .Int "discount_percent" }}
              <li{{ if ge $discount 40 }} class="color-positive"{{ end }}>{{ $discount }}% off</li>
              </ul>
            </li>
            {{ end }}
            </ul>
            
    - size: full
      widgets:
        - type: weather
          hide-header: true
          location: Jakarta, Indonesia
          hide-location: true
          units: metric # alternatively "imperial"
          hour-format: 24h # alternatively "24h"
          # Optionally hide the location from being displayed in the widget
          # hide-location: true
          
        - $include: search.yml
          
        - type: bookmarks
          groups:
            - links:
                - title: Search
                  url: https://search.shrew-economy.ts.net
                - title: Photos
                  url: https://photos.shrew-economy.ts.net
                - title: Music
                  url: https://music.shrew-economy.ts.net
                - title: Notes
                  url: https://notes.shrew-economy.ts.net
            - title: Tools
              links:
                - title: File Explorer
                  url: https://files.shrew-economy.ts.net
                - title: PDF Editor
                  url: https://pdf.shrew-economy.ts.net
                - title: Password Manager
                  url: https://vault.shrew-economy.ts.net
                - title: Health Dashboard
                  url: https://fit.shrew-economy.ts.net
            - title: Admin
              links:
                - title: Terminal
                  url: https://ssh.shrew-economy.ts.net
                - title: DNS
                  url: https://dns.shrew-economy.ts.net
                - title: Monitoring
                  url: https://scout.zyonlie.net
                - title: Docker Manager
                  url: https://100.111.242.57:31015
                  
    - size: small
      widgets:
        - type: clock
          hide-header: true
          hour-format: 24h
          timezones:
            - timezone: Etc/UTC
              label: UTC
            - timezone: America/New_York
              label: EST
            - timezone: America/Los_Angeles
              label: PST
            - timezone: Asia/Tokyo
              label: JST
              
        - type: markets
          hide-header: true
          cache: 1m
          markets:
            - symbol: ^JKSE
              name: IHSG
              chart-link: https://finance.yahoo.com/quote/%5EJKSE/
            - symbol: IDR=X
              name: USD/IDR
              chart-link: https://finance.yahoo.com/quote/IDR=X/
            - symbol: SGDIDR=X
              name: SGD/IDR
              chart-link: https://finance.yahoo.com/quote/SGDIDR=X/
            - symbol: GC=F
              name: GOLD
              chart-link: https://finance.yahoo.com/quote/GC=F/
            - symbol: CL=F
              name: OIL
              chart-link: https://finance.yahoo.com/quote/CL%3DF/

